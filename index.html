<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slamingo Cup</title>
    <link rel="preload" href="assets/header.png" as="image" />
    <link rel="preload" href="assets/mlb-block.tff.woff" as="font" type="font/woff" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..800&family=Source+Serif+4:opsz,wght@8..60,400;600&display=swap"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  </head>
  <body>
    <header class="banner">
      <div class="banner-inner">
        <h1 id="league-name">Slamingo Cup</h1>
      </div>
    </header>

    <div class="page">
      <nav class="site-nav">
        <a href="#standings" data-view="standings">Standings</a>
        <a href="#record-book" data-view="record-book">Record Book</a>
      </nav>

      <div id="view-standings">
        <div class="filter-toggle">
          <button data-filter="active" class="is-active">Active</button>
          <button data-filter="inactive">Inactive</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead id="standings-head"></thead>
            <tbody id="standings-body"></tbody>
          </table>
        </div>
      </div>

      <div id="view-record-book" hidden>
        <div id="record-book-wrap"></div>
      </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/standings.js"></script>
    <script src="js/record_book.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
